name: Tests & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets you trigger a run by hand from the Actions tab.
  workflow_dispatch:

# Least privilege by default; the deploy job requests more below.
permissions:
  contents: read

jobs:
  e2e:
    name: Playwright end-to-end tests
    runs-on: ubuntu-latest

    # One test run per branch at a time; a newer push cancels the older run.
    concurrency:
      group: ${{ github.workflow }}-tests-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Read the exact Playwright version from the lockfile so the cache key
      # changes whenever Playwright (and therefore the browser build) changes.
      - name: Read Playwright version
        id: pw
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

      # Caching ~/.cache/ms-playwright avoids re-downloading the ~170MB Chromium
      # build on every run. This step used to take 17-104s; a cache hit makes it
      # near-instant.
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}

      # Both Playwright projects (mobile "Pixel 5" + "Desktop Chrome") use
      # Chromium, so installing just that browser is enough and much faster.
      - name: Install Playwright browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # OS libraries are not part of the cache, so make sure they are present
      # even when the browser binaries came from cache.
      - name: Install Playwright system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run tests
        run: npm test

      # Uploaded on every run (pass or fail) and kept for 3 days.
      # Download from the run's page: Actions tab -> run -> Artifacts.
      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 3
          if-no-files-found: ignore

      # Raw videos, screenshots and trace zips - the most useful for debugging.
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 3
          if-no-files-found: ignore

  deploy:
    name: Deploy to GitHub Pages
    # Hard gate: this job (and therefore the live site) only runs if tests pass.
    needs: e2e
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest

    # Never cancel a deploy halfway through; queue instead.
    concurrency:
      group: pages
      cancel-in-progress: false

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Publish ONLY the static app - never tests/, node_modules/ or configs.
      - name: Stage static site
        run: |
          mkdir -p _site
          cp -r index.html manifest.json sw.js defaults.json icons LICENSE README.md _site/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
