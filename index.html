          <button class="btn btn-primary" style="flex:1;" onclick="saveRoutine()">${isEdit ? 'Save Changes' : 'Save Preset'}</button>
          <button class="btn" onclick="${state.routineCancelTarget === 'routines' ? 'openRoutinesModal()' : 'closeModal()'}">Cancel</button>
        </div>
      </div>
    </div>
  `;
}

async function updateSetField(entryId, setId, field, value){
  const num = parseFloat(value);
  const entry = state.currentLog.find(e=>e.id===entryId);
  if(!entry) return;
  const set = entry.sets.find(s=>s.id===setId);
  if(!set) return;

  if (isNaN(num) || num <= 0) {
    set[field] = '';
  } else {
    set[field] = num;
  }
  await saveCurrentLog();
}

async function exportData(){
  const allLogs = {};
  for(const d of state.logDates){
    allLogs[d] = (await safeGet('log:'+d)) || [];
  }
  
  const now = new Date();
  const pad = num => String(num).padStart(2, '0');
  
  const year = now.getFullYear();
  const month = pad(now.getMonth() + 1);
  const day = pad(now.getDate());
  const hours = pad(now.getHours());
  const minutes = pad(now.getMinutes());
  const seconds = pad(now.getSeconds());
  
  const timestampStr = `${year}-${month}-${day}-${hours}${minutes}${seconds}`;
  
  const fullBackupPayload = {
    exportedAt: now.toISOString(),
    version: "2.0",
    exercises: state.exercises,
    tags: state.tags,
    routines: state.routines,
    logDates: state.logDates,
    logs: allLogs
  };

  const blob = new Blob([JSON.stringify(fullBackupPayload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; 
  a.download = `workout-app-log-${timestampStr}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast("Exported full application log", false);
}

function triggerImport(){ $('#importInput').click(); }

async function handleImportFile(file){
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    if(!data.exercises || !data.tags || !data.logs) throw new Error("bad format");
    
    state.exercises = data.exercises || [];
    state.tags = data.tags || [];
    state.routines = data.routines || [];
    state.logDates = data.logDates || Object.keys(data.logs);
    
    await safeSet('exercises', state.exercises);
    await safeSet('tags', state.tags);
    await safeSet('routines', state.routines);
    await safeSet('logDates', state.logDates);
    
    for(const [date, entries] of Object.entries(data.logs)){
      await safeSet('log:'+date, entries);
    }
    
    await loadLogForDate(state.currentDate);
    showToast("Full application restored successfully!", false);
    render();
  }catch(e){
    showToast("Import failed — invalid backup file", false);
  }
}

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }

function syncMobileViewport(){
  if(window.visualViewport){
    document.documentElement.style.setProperty('--app-viewport-height', `${window.visualViewport.height}px`);
  }
}

function syncActionFooterHeight(){
  const footer = document.querySelector('.action-footer');
  if(footer) document.documentElement.style.setProperty('--action-footer-height', `${footer.getBoundingClientRect().height}px`);
}

syncMobileViewport();
if(window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true){
  document.documentElement.classList.add('standalone-pwa');
}
if(window.visualViewport) window.visualViewport.addEventListener('resize', () => {
  syncMobileViewport();
  syncActionFooterHeight();
});

loadAll();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then((registration) => registration.update()).catch((e) => {
      console.warn('Service worker registration failed', e);
      showToast("Offline support couldn't be enabled", false);
    });
  });
}
</script>
